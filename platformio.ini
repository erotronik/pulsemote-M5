; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; to save building both platforms, you can update .vscode/settings.json for example
;
;    "terminal.integrated.env.linux": {
;        "PLATFORMIO_DEFAULT_ENVS": "m5stack-cores3"
;    }

[env]
platform = espressif32
framework = arduino
check_tool = cppcheck
build_flags = 
    -DLV_CONF_PATH="${platformio.include_dir}/lv_conf.h"
    -DCORE_DEBUG_LEVEL=4
lib_deps =
    lvgl/lvgl@9.2.0
	adafruit/Adafruit MCP23017 Arduino Library
	robtillaart/PCA9685
 ;   https://github.com/erotronik/CoyoStim.git
    h2zero/NimBLE-Arduino@^1.4.3
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7

[env:m5stack-core2]
board = m5stack-core2
monitor_speed = 115200

[env:m5stack-cores3]
platform  = espressif32@6.8.1 
board = m5stack-cores3
lib_deps = 
    ${env.lib_deps}
    m5stack/M5Unified

build_flags = 
    ${env.build_flags}
    -DM5_BOARD
    -DARDUINO_USB_MODE=1

[env:waveshare-s3]
monitor_speed = 115200

board = esp32-s3-devkitc-1
board_build.flash_size  = 8MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi

lib_deps = 
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@1.6.1
    tamctec/TAMC_GT911
build_flags = 
    ${env.build_flags}
    -DWAVESHARE_7
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
