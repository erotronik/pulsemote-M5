; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; to save building both platforms, you can update .vscode/settings.json for example
;
;    "terminal.integrated.env.linux": {
;        "PLATFORMIO_DEFAULT_ENVS": "m5stack-cores3"
;    }

[env]
framework = arduino
check_tool = cppcheck
lib_extra_dirs = components
build_flags = 
    -DLV_CONF_PATH="${platformio.include_dir}/lv_conf.h"
    -DCORE_DEBUG_LEVEL=4
lib_deps =
    lvgl/lvgl@9.2.0
 ;   https://github.com/erotronik/CoyoStim.git
    h2zero/NimBLE-Arduino@^2.3
    bblanchon/ArduinoJson @ ^7

[env:m5stack-core2]
platform  = espressif32@6.8.1 
board = m5stack-core2
monitor_speed = 115200

[env:m5stack-cores3]
platform  = espressif32@6.8.1 
board = m5stack-cores3
framework = arduino
lib_deps = 
    ${env.lib_deps}
    m5stack/M5Unified

build_flags = 
    ${env.build_flags}
    -DCONFIG_BOARD_M5CORES3
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=9
    -DCONFIG_PULSEMOTE_PCB
    -DHASWIFICOPRO

[env:waveshare-s3]
platform  = espressif32@6.8.1 
monitor_speed = 115200

board = esp32-s3-devkitc-1
board_build.flash_size = 16MB ; it's a MCN16R8 on the board
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

lib_deps = 
    ${env.lib_deps}
    esp-arduino-libs/esp-lib-utils @0.3.0 ; https://github.com/...
    https://github.com/esp-arduino-libs/ESP32_IO_Expander
    https://github.com/esp-arduino-libs/ESP32_Display_Panel @1.0.5
build_flags = 
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7=1
    -DCONFIG_LV_MEMCPY_MEMSET_STD=y ;; Waveshare doc https://files.waveshare.com/wiki/common/Performance.pdf
    -DCONFIG_LV_DISP_DEF_REFR_PERIOD=10 ;; Waveshare doc
